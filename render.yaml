# Render Blueprint: deploys the app as a free web service.
# Data is stored in the Postgres database given by DATABASE_URL (e.g. a free
# Neon database) because free Render services lose local files on restart.
services:
  - type: web
    name: accountability-buddy
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # you paste your Postgres connection string when deploying
      - key: NODE_VERSION
        value: "22"
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY
        value: "1"
